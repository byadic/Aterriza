<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aterriza · Acceso</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Pequeños ajustes de refinamiento (puedes moverlos a estilos.css) */
    :root {
      --radius: 16px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #f4f6f9;
      color: #1a1d23;
      line-height: 1.5;
    }

    .banner {
      background: linear-gradient(145deg, #0f3460, #1a5276);
      color: white;
      padding: 2.8rem 1.5rem 3.2rem;
      text-align: center;
    }

    .banner .in {
      max-width: 480px;
      margin: 0 auto;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      margin-bottom: 1.4rem;
      opacity: 0.95;
    }

    .marca svg {
      width: 28px;
      height: 28px;
    }

    .banner h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.6rem;
      line-height: 1.2;
    }

    .banner p {
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.88;
      font-weight: 400;
    }

    .sube {
      max-width: 440px;
      margin: -1.8rem auto 3rem;
      padding: 0 1.25rem;
    }

    .opciones {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .opcion {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      width: 100%;
      padding: 1.25rem 1.3rem;
      background: white;
      border: 2px solid transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      transition: all 0.22s ease;
      font-family: inherit;
    }

    .opcion:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .opcion:focus-visible {
      outline: 3px solid #0f3460;
      outline-offset: 2px;
    }

    .opcion[aria-pressed="true"] {
      border-color: #0f3460;
      background: #f0f6fc;
      box-shadow: 0 0 0 1px #0f3460, var(--shadow);
    }

    .opcion .icono {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: #e8f0f8;
      border-radius: 12px;
      color: #0f3460;
    }

    .opcion[aria-pressed="true"] .icono {
      background: #0f3460;
      color: white;
    }

    .opcion .icono svg {
      width: 22px;
      height: 22px;
    }

    .opcion strong {
      display: block;
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
      color: #1a1d23;
    }

    .opcion .desc {
      display: block;
      font-size: 0.92rem;
      color: #5c6570;
      font-weight: 400;
    }

    #paso2 {
      margin-top: 1.8rem;
      background: white;
      border-radius: var(--radius);
      padding: 1.8rem 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #paso2 h2 {
      margin: 0 0 0.4rem;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #paso2 > p {
      margin: 0 0 1.5rem;
      color: #5c6570;
      font-size: 0.98rem;
    }

    .acciones {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .btn {
      display: block;
      padding: 0.95rem 1.2rem;
      background: #0f3460;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s, transform 0.15s;
    }

    .btn:hover {
      background: #0a2748;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.sec {
      background: white;
      color: #0f3460;
      border: 2px solid #d0d9e4;
    }

    .btn.sec:hover {
      background: #f5f8fb;
      border-color: #0f3460;
    }

    .enlace {
      display: inline-block;
      margin-top: 1.3rem;
      background: none;
      border: none;
      color: #5c6570;
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0.3rem;
    }

    .enlace:hover {
      color: #0f3460;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .banner {
        padding: 2.2rem 1.2rem 2.8rem;
      }
      .banner h1 {
        font-size: 1.6rem;
      }
      .sube {
        margin-top: -1.4rem;
      }
    }
  </style>
</head>
<body>
  <header class="banner">
    <div class="in">
      <div class="marca">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 15.5v-1.7l-8-5V3.5a1.5 1.5 0 0 0-3 0v5.3l-8 5v1.7l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-6z"/>
        </svg>
        Aterriza
      </div>
      <h1>Bienvenido a tu nueva aventura</h1>
      <p>Elige el tipo de pase que mejor se adapte a ti y continúa.</p>
    </div>
  </header>

  <main class="sube">
    <div class="opciones" role="group" aria-label="Tipo de pase">
      <button class="opcion" data-tipo="universitario" aria-pressed="false">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 9l10-5 10 5-10 5z"/>
            <path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>
          </svg>
        </span>
        <span>
          <strong>Foráneo</strong>
          <span class="desc">Conoce tu nuevo lugar.</span>
        </span>
      </button>

      <button class="opcion" data-tipo="foraneo" aria-pressed="false">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="7" width="18" height="13" rx="3"/>
            <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>
          </svg>
        </span>
        <span>
          <strong>Residente</strong>
          <span class="desc">Ayuda a conectar.</span>
        </span>
      </button>
    </div>

    <section id="paso2" hidden aria-live="polite">
      <h2 id="titulo-paso2"></h2>
      <p>¿Ya tienes cuenta o es tu primer viaje con nosotros?</p>
      <div class="acciones">
        <a class="btn" id="ir-login" href="#">Ya tengo cuenta</a>
        <a class="btn sec" id="ir-registro" href="#">Crear cuenta nueva</a>
      </div>
      <button class="enlace" id="cambiar" type="button">← Cambiar tipo de pase</button>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Redirige directamente según el tipo de usuario seleccionado.
    document.querySelectorAll(".opcion").forEach((boton) => {
      boton.addEventListener("click", (evento) => {
        evento.preventDefault();
        evento.stopImmediatePropagation();

        const tipo = boton.dataset.tipo;
        if (tipo === "universitario") {
          window.location.href = "universitario.html";
        } else if (tipo === "foraneo") {
          window.location.href = "forraneos.html";
        }
      }, true);
    });
  </script>

</body>
</html>
